name: Daily rent jobs

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 08:00 IST, every day
  workflow_dispatch: {}     # "Run workflow" button for manual runs

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake the API (Render free tier sleeps)
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 "${{ secrets.API_URL }}/api/health"; then exit 0; fi
            echo "API not awake yet, retrying in 20s..."; sleep 20
          done
          exit 1
      - name: Run daily jobs
        run: |
          curl -fsS --max-time 300 -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.API_URL }}/api/jobs/run-daily"
