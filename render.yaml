# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: rent-manager-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run on every deploy (idempotent), then the API starts.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false            # Neon connection string
      - key: FRONTEND_URL
        sync: false            # e.g. https://your-app.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: FERNET_KEY
        sync: false            # generate locally, keep a safe backup; never rotate casually
      - key: CRON_SECRET
        generateValue: true    # copy this value into the GitHub secret CRON_SECRET
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: rent-private
      - key: EMAIL_BACKEND
        value: smtp
      - key: SYSTEM_GMAIL_ADDRESS
        sync: false
      - key: SYSTEM_GMAIL_APP_PASSWORD
        sync: false
